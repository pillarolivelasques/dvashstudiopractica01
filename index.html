<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dvash Studio · Biblias pintadas a mano</title>
  <link rel="icon" href="img/favicon.webp" type="image/webp">

  <script>try{if(localStorage.getItem('modo')==='oscuro')document.documentElement.classList.add('dark')}catch(e){}</script>
  <!-- Tailwind CSS v4 (Play CDN) + sistema de diseño propio -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme {
      --color-crema: #F6F1E3;   /* fondo papel */
      --color-lino:  #ECE3D3;   /* fondo secundario */
      --color-oliva: #4F5A3A;   /* verde del monograma */
      --color-rosa:  #9C7D72;   /* rosa del sello */
      --color-rubor: #E7D3CA;   /* rosa claro */
      --color-oro:   #B39150;   /* dorado (solo detalles) */
      --color-noche: #1E2318;   /* fondo modo oscuro */
      --color-musgo: #2A3122;   /* fondo secundario modo oscuro */
      --font-serif:  "Cormorant Garamond", serif;
      --font-sc:     "Cormorant SC", serif;
      --font-script: "Pinyon Script", cursive;
      --font-titulo: "Cormorant SC", serif;
      --font-texto:  "Cormorant Garamond", serif;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+SC:wght@500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="papel bg-crema text-oliva transition-colors duration-500 font-serif text-[17px] leading-relaxed dark:bg-noche dark:text-crema">
  <!-- ===== BARRA SUPERIOR ===== -->
  <div class="bg-oliva text-crema text-center py-2 font-sc text-sm tracking-[0.2em] dark:bg-crema dark:text-oliva">
    Biblias pintadas a mano · Tienda en Lagasca, 61 · Madrid
  </div>

  <!-- ===== CABECERA ===== -->
  <header class="border-b border-oliva/20 dark:border-crema/20">
    <nav class="grid grid-cols-3 items-center px-4 md:px-10 py-4">
      <!-- Botón menú móvil (solo en móvil) -->
      <button id="btn-menu" class="md:hidden justify-self-start p-2 -ml-2 hover:text-rosa" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-movil">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path class="linea-1" d="M3 7h18"/><path class="linea-2" d="M3 12h18"/><path class="linea-3" d="M3 17h18"/></svg>
      </button>
      <ul class="hidden md:flex md:gap-5 lg:gap-8 font-sc tracking-widest text-sm">
        <li><a href="#coleccion" class="hover:text-rosa">Colección</a></li>
        <li><a href="#estilos" class="hover:text-rosa">Estilos</a></li>
        <li><a href="#ofertas" class="hover:text-rosa">Ofertas</a></li>
      </ul>
      <a href="#" class="justify-self-center"><img src="img/logo-dvash.webp" alt="Dvash" class="h-10 md:h-12"></a>
      <ul class="flex items-center gap-5 lg:gap-8 justify-end font-sc tracking-widest text-sm">
        <li class="hidden md:block"><a href="#taller" class="hover:text-rosa">El taller</a></li>
        <li class="hidden md:block"><a href="#visitanos" class="hover:text-rosa">Visítanos</a></li>
        <li><a href="#contacto" class="hover:text-rosa">Encargar</a></li>
        <li><button type="button" class="btn-modo p-1 -m-1 hover:text-rosa" aria-label="Cambiar a modo oscuro" aria-pressed="false">
          <svg class="dark:hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="hidden dark:block" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button></li>
      </ul>
    </nav>

    <!-- Menú móvil (se abre con jQuery) -->
    <nav id="menu-movil" aria-label="Menú móvil" class="md:hidden border-t border-oliva/20 dark:border-crema/20" style="display:none">
      <ul class="flex flex-col px-4 py-2 text-2xl">
        <li><a href="#coleccion" class="block py-3 border-b border-oliva/10 hover:text-rosa dark:border-crema/10">Colección</a></li>
        <li><a href="#estilos" class="block py-3 border-b border-oliva/10 hover:text-rosa dark:border-crema/10">Estilos</a></li>
        <li><a href="#ofertas" class="block py-3 border-b border-oliva/10 hover:text-rosa dark:border-crema/10">Ofertas</a></li>
        <li><a href="#taller" class="block py-3 border-b border-oliva/10 hover:text-rosa dark:border-crema/10">El taller</a></li>
        <li><a href="#visitanos" class="block py-3 border-b border-oliva/10 hover:text-rosa dark:border-crema/10">Visítanos</a></li>
        <li><a href="#contacto" class="block py-3 hover:text-rosa">Encargar</a></li>
      </ul>
    </nav>
  </header>
</body>
</html>
